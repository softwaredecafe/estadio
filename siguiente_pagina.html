<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cargando...</title>
    <!-- Misma fuente deportiva -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

    <style>
        /* ============================
           ESTILOS GENERALES (Mobile First)
           ============================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Misma imagen de fondo que la pantalla principal */
            background-image: url('img/inde.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            align-items: center; /* Centra las barras verticalmente */
            font-family: 'Anton', sans-serif;
            position: relative;
        }

        /* Capa oscura para resaltar la animación */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        /* ============================
           CONTENEDOR DE CARGA
           ============================ */
        .loading-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 140px; /* Altura total de las barras */
        }

        /* Este es el bloque que se deslizará de izquierda a derecha */
        .sliding-bars {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            /* Empieza totalmente fuera de la pantalla a la izquierda */
            transform: translateX(-100%);
            /* Animación lineal de 4 segundos */
            animation: slideIn 4s linear forwards; 
        }

        @keyframes slideIn {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0%); } /* Termina llenando la pantalla */
        }

        /* ============================
           DISEÑO DE LAS BARRAS
           ============================ */
        .bar-red {
            background-color: #d31a20; /* Rojo */
            height: 70px;
            /* La separación negra gruesa entre los colores */
            border-bottom: 6px solid #000; 
            display: flex;
            align-items: center;
            padding-left: 20px;
        }

        .bar-blue {
            background-color: #002c8a; /* Azul oscuro */
            height: 64px; /* Resto de la altura */
        }

        .loading-text {
            color: #eeb68a; /* Color de tu texto original */
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* ============================
           GIF DEL PERSONAJE
           ============================ */
        .runner-gif {
            position: absolute;
            /* Lo colocamos justo en el borde derecho que va avanzando */
            right: -50px; 
            top: 50%;
            transform: translateY(-50%); /* Centrado verticalmente entre las dos barras */
            height: 160px; /* Ajusta este tamaño según lo grande que sea tu gif */
            z-index: 10;
        }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- Contenedor principal de la barra -->
    <div class="loading-wrapper">
        <div class="sliding-bars" id="loading-bar">
            
            <!-- Barra superior roja con texto -->
            <div class="bar-red">
                <div class="loading-text">
                    CARGANDO<span id="dots"></span>
                </div>
            </div>
            
            <!-- Barra inferior azul -->
            <div class="bar-blue"></div>

            <!-- TU GIF ANIMADO (Asegúrate de tenerlo en la carpeta img) -->
            <img src="img/diabli.gif" class="runner-gif" alt="Personaje corriendo">

        </div>
    </div>

    <script>
        // ============================
        // LÓGICA DE JAVASCRIPT
        // ============================

        // 1. ANIMACIÓN DE LOS PUNTOS SUSPENSIVOS
        const dotsEl = document.getElementById('dots');
        let dotCount = 0;

        // Se ejecuta cada 400 milisegundos para dar el efecto de carga
        setInterval(() => {
            dotCount = (dotCount + 1) % 4; // Ciclo: 0, 1, 2, 3
            dotsEl.textContent = '.'.repeat(dotCount);
        }, 400);

        // 2. DETECTAR EL FINAL DE LA ANIMACIÓN PARA CAMBIAR DE PÁGINA
        const slidingBar = document.getElementById('loading-bar');

        slidingBar.addEventListener('animationend', () => {
            // Cuando la animación 'slideIn' termine (después de 4 segundos),
            // redirige automáticamente a la tercera página.
            // Pon aquí el nombre de tu siguiente archivo HTML.
            window.location.href = 'tercera_pagina.html'; 
        });
    </script>
</body>
</html>
